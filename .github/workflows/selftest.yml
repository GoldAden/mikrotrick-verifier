name: self-test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  offline-selftest:
    name: Offline detection self-test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all sources
        run: |
          python -m compileall -q mtx.py tools tests

      - name: Run offline logic self-test
        run: python tests/selftest_inproc.py

      - name: Run end-to-end CLI test
        run: python tests/test_mtx_cli.py

      - name: Upload sample reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-reports-py${{ matrix.python }}
          path: examples/report_*.json
          if-no-files-found: ignore
